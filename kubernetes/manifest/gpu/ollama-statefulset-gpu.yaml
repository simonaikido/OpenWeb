apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ollama
  namespace: open-webui
spec:
  selector:
    matchLabels:
      app: ollama
  serviceName: "ollama"
  template:
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
      - name: ollama
        resources:
          limits:
            nvidia.com/gpu: "1"
